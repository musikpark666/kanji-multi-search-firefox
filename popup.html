<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>漢字一括検索</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <div class="mark" aria-hidden="true">字</div>
        <div>
          <h1>漢字一括検索</h1>
          <p>一字の漢字を複数の辞典でまとめて開きます。</p>
        </div>
      </header>

      <form id="search-form">
        <label for="character-input">検索する漢字</label>
        <div class="search-row">
          <input
            id="character-input"
            name="character"
            type="text"
            inputmode="text"
            autocomplete="off"
            spellcheck="false"
            placeholder="願"
            aria-describedby="input-help"
          >
          <button id="open-button" class="primary" type="submit">まとめて開く</button>
        </div>
        <p id="input-help" class="help">ショートカット Alt+Shift+H · 選択した漢字は右クリックからも検索できます。</p>
      </form>

      <section class="sites" aria-labelledby="sites-title">
        <div class="section-heading">
          <h2 id="sites-title">開くサイト</h2>
          <div class="selection-actions">
            <button id="select-default" type="button">標準</button>
            <button id="select-all" type="button">すべて</button>
            <button id="select-none" type="button">解除</button>
          </div>
        </div>
        <div id="site-list"></div>
      </section>

      <section id="recent-section" class="recent" aria-labelledby="recent-title" hidden>
        <h2 id="recent-title">最近の検索</h2>
        <div id="recent-list" class="recent-list"></div>
      </section>

      <footer>
        <span id="selection-count"></span>
        <span id="status" role="status" aria-live="polite"></span>
      </footer>
    </main>

    <script src="sites.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
